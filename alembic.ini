[alembic]
script_location = %(here)s/src/quartet/db/alembic
# The database URL is never configured here: env.py takes it from Config.attributes["url"],
# then `-x url=...`, then load_settings().migrator_database_url (QUARTET_MIGRATOR_DATABASE_URL).
# It never falls back to the application URL.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
